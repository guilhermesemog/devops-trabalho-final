name: CI, publish, and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: task-manager-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_manager_test
          POSTGRES_USER: task_manager
          POSTGRES_PASSWORD: task_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U task_manager -d task_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 5s
    env:
      TEST_DATABASE_URL: postgresql+psycopg://task_manager:task_manager@127.0.0.1:5432/task_manager_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-runtime.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  build-and-publish:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image: ${{ steps.image.outputs.ref }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Get lowercase image name
        id: image
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: echo "ref=ghcr.io/${SOURCE_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    runs-on: [self-hosted, linux, x64, deploy]
    needs: build-and-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    outputs:
      image: ${{ needs.build-and-publish.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Add local tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check K3d access
        run: |
          test -r "$HOME/.kube/config"
          kubectl get namespace task-manager >/dev/null
      - name: Run database migration
        env:
          IMAGE_REF: ${{ needs.build-and-publish.outputs.image }}
          MIGRATION_JOB: task-manager-migration-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sed -E \
            -e "s|name: task-manager-migration$|name: ${MIGRATION_JOB}|" \
            -e "s|image: ghcr.io/guilhermesemog/devops-trabalho-final:[^[:space:]]+|image: ${IMAGE_REF}|" \
            kubernetes/migration-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete "job/${MIGRATION_JOB}" \
            --namespace task-manager --timeout=330s

  deploy-k3d:
    runs-on: [self-hosted, linux, x64, deploy]
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Add local tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy API to K3d
        env:
          IMAGE_REF: ${{ needs.migrate.outputs.image }}
        run: |
          sed -E \
            "s|image: ghcr.io/guilhermesemog/devops-trabalho-final:[^[:space:]]+|image: ${IMAGE_REF}|" \
            kubernetes/deployment.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/service.yaml
          kubectl rollout status deployment/task-manager-api \
            --namespace task-manager --timeout=180s

  deploy-nomad:
    runs-on: [self-hosted, linux, x64, deploy]
    needs: migrate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Add local tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Deploy API to Nomad
        env:
          IMAGE_REF: ${{ needs.migrate.outputs.image }}
          NOMAD_ADDR: http://127.0.0.1:4646
        run: |
          set -eu
          test -r "$HOME/.config/nomad/task-manager.auto.hcl"
          test -r "$HOME/.config/nomad/ci-deploy.token"
          IFS= read -r NOMAD_TOKEN < "$HOME/.config/nomad/ci-deploy.token"
          export NOMAD_TOKEN
          test -n "$NOMAD_TOKEN"
          nomad job run -detach=false \
            -var-file="$HOME/.config/nomad/task-manager.auto.hcl" \
            -var="image=${IMAGE_REF}" \
            nomad/task-manager-api.nomad
          nomad job status task-manager-api
          ALLOC_ID=$(nomad job allocs -json task-manager-api | \
            python3 -c 'import json,sys; print(next(a["ID"] for a in json.load(sys.stdin) if a["ClientStatus"] == "running"))')
          NOMAD_PORT=$(nomad alloc status -json "$ALLOC_ID" | \
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["Value"] for n in d["AllocatedResources"]["Shared"]["Networks"] for p in n["DynamicPorts"] if p["Label"] == "http"))')
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:${NOMAD_PORT}/health" >/dev/null
